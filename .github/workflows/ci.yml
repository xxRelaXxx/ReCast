name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --release -p recast-app

      - name: Lint
        run: cargo clippy --release -p recast-app -- -D warnings

  cli:
    name: Command line tool (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('Cargo.lock') }}

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --release -p recast-cli

      - name: Lint
        run: cargo clippy --release -p recast-cli -- -D warnings

      - name: Test
        run: cargo test --release -p recast-cli -p recast-core

  launcher:
    name: Launcher (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/launcher/target
          key: ${{ runner.os }}-cargo-launcher-${{ hashFiles('apps/launcher/Cargo.lock') }}

      - name: Create a placeholder payload
        # The launcher embeds the runtime with include_bytes!. The real files are
        # produced by tools/build-release.ps1 and are not committed, so the build
        # is checked with placeholders here.
        shell: pwsh
        run: |
          $payload = 'apps/launcher/payload'
          New-Item -ItemType Directory -Force "$payload/vcam/x64" | Out-Null
          New-Item -ItemType Directory -Force "$payload/vcam/x86" | Out-Null
          'placeholder' | Set-Content "$payload/recast-app.exe"
          'placeholder' | Set-Content "$payload/recast-cli.exe"
          'placeholder' | Set-Content "$payload/ffmpeg.exe"
          'placeholder' | Set-Content "$payload/ReCastPhone.apk"
          'placeholder' | Set-Content "$payload/vcam/x64/softcam.dll"
          'placeholder' | Set-Content "$payload/vcam/x86/softcam.dll"

      - name: Check the formatting
        run: cargo fmt --manifest-path apps/launcher/Cargo.toml --all -- --check

      - name: Build
        run: cargo build --release --manifest-path apps/launcher/Cargo.toml

      - name: Lint
        run: cargo clippy --release --manifest-path apps/launcher/Cargo.toml -- -D warnings

  phone:
    name: Phone app (Android)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show the Android SDK
        run: |
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          if (Test-Path $env:ANDROID_HOME) {
            Get-ChildItem (Join-Path $env:ANDROID_HOME 'platforms') -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
          }

      - name: Build the APK
        working-directory: android
        run: .\gradlew.bat assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ReCastPhone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
