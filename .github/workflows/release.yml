name: Release

# Pushing a tag such as "v1.0.0" publishes the release assets.
# The binaries are the committed ones in desktop/ and phone/, so run
# tools/build-release.ps1 and commit the result before tagging.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Package the ready-to-use files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          stage="ReWebCam-${VERSION}"
          mkdir -p "${stage}/desktop" "${stage}/phone"

          cp desktop/Rewebcam.exe "${stage}/desktop/Rewebcam.exe"
          cp phone/RewebcamPhone.apk "${stage}/phone/RewebcamPhone.apk"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "${stage}/"
          cp docs/README-first.txt "${stage}/README.txt"
          cp docs/USER-GUIDE.md "${stage}/USER-GUIDE.md"

          zip -r "ReWebCam-${VERSION}-win64.zip" "${stage}"
          rm -rf "${stage}"

      - name: Download the matching FFmpeg source
        env:
          FFMPEG_VERSION: '9.0.2'
          FFMPEG_SHA256: '8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e'
        run: |
          set -euo pipefail
          url="https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          for attempt in 1 2 3; do
            if curl -sSfL --retry 3 -o "ffmpeg-${FFMPEG_VERSION}.tar.xz" "$url"; then
              break
            fi
            echo "Download failed (attempt ${attempt}), retrying..."
            sleep 10
          done
          test -f "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          echo "${FFMPEG_SHA256}  ffmpeg-${FFMPEG_VERSION}.tar.xz" | sha256sum -c -

      - name: Write the checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            sha256sum "ReWebCam-${VERSION}-win64.zip"
            sha256sum desktop/Rewebcam.exe
            sha256sum phone/RewebcamPhone.apk
            sha256sum "ffmpeg-9.0.2.tar.xz"
          } | sed "s#  #  #" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -f RELEASE_NOTES.md ]; then
            exit 0
          fi
          {
            echo "Rewebcam ${VERSION}."
            echo
            echo "Windows 10/11 desktop app and the Android phone app. No accounts, no ads,"
            echo "no telemetry: the phone streams directly to the PC over USB or Wi-Fi."
            echo
            echo "Downloads:"
            echo
            echo "* ReWebCam-${VERSION}-win64.zip - both ready-to-use files in one archive"
            echo "* Rewebcam.exe - the desktop app on its own"
            echo "* RewebcamPhone.apk - the phone app"
            echo "* ffmpeg-9.0.2.tar.xz - the LGPL source of the bundled FFmpeg decoder"
            echo "* SHA256SUMS.txt - checksums for all of the above"
            echo
            echo "The full documentation is in the repository."
          } > RELEASE_NOTES.md

      - name: Extract the changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -f CHANGELOG.md ]; then
            awk -v version="${VERSION}" '
              /^## \[/ {
                if (found) { exit }
                if (index($0, "[" version "]") > 0) { found = 1 }
              }
              found { print }
            ' CHANGELOG.md > CHANGELOG_SECTION.md
            if [ -s CHANGELOG_SECTION.md ]; then
              {
                echo
                echo "---"
                echo
                cat CHANGELOG_SECTION.md
              } >> RELEASE_NOTES.md
            fi
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "ReWebCam-${VERSION}-win64.zip"
            "desktop/Rewebcam.exe"
            "phone/RewebcamPhone.apk"
            "ffmpeg-9.0.2.tar.xz"
            "SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release already exists, replacing the assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "Rewebcam ${VERSION}" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Rewebcam ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi
