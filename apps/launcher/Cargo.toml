[package]
name = "recast-launcher"
version = "1.0.0"
edition = "2021"
description = "Single-file launcher and installer for ReCast"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ReCast"
path = "src/main.rs"

[dependencies]
recast-core = { path = "../core" }
eframe = "0.31"
egui = "0.31"
egui-phosphor = "0.9"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
