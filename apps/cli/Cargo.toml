[package]
name = "recast-cli"
version = "1.0.3"
edition = "2021"
description = "Command line interface for ReCast"
license = "MIT"

[[bin]]
name = "recast"
path = "src/main.rs"

[dependencies]
recast-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
