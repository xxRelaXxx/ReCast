[package]
name = "recast-app"
version = "1.0.1"
edition = "2021"
description = "Use an Android phone as a low-latency webcam and microphone on Windows"
license = "MIT"
build = "build.rs"

[[bin]]
name = "recast-app"
path = "src/main.rs"

[dependencies]
recast-core = { path = "../core" }
eframe = "0.31"
egui = "0.31"
egui-phosphor = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rand = "0.9"
local-ip-address = "0.6"
libloading = "0.9"
cpal = "0.18"
nnnoiseless = { version = "0.5.2", default-features = false }
qrcode = { version = "0.14", default-features = false }
raw-window-handle = "0.6"

[build-dependencies]
winres = "0.1"
