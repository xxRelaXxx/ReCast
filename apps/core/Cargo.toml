[package]
name = "recast-core"
version = "1.0.2"
edition = "2021"
description = "Shared install, registry and control-channel logic for ReCast"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
